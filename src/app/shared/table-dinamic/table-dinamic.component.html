<section class="content-dinamic-table">
    <div *ngIf="isLoadingResults" class="example-loading-shade">
        <mat-spinner></mat-spinner>
    </div>

    <div class="example-container" tabindex="0">
        <table mat-table [dataSource]="dataSource" matSort (matSortChange)="announceSortChange($event)">
            <ng-container *ngFor="let item of columnsToDisplay">

                <!-- Columns with children -->
                <ng-container *ngIf="item.colspan && item.children">
                    <!-- Parent column header -->
                    <ng-container matColumnDef="{{ item.name }}">
                        <th mat-header-cell *matHeaderCellDef [attr.colspan]="item.children.length" class="colspanColumn">
                            {{ item.displayname }}
                        </th>
                    </ng-container>
                
                    <!-- Child columns -->
                    <ng-container *ngFor="let child of item.children">
                        <ng-container matColumnDef="{{ child.name }}">
                            <th mat-header-cell *matHeaderCellDef rowspan="1">
                                {{ child.displayname }}
                            </th>
                            <td mat-cell *matCellDef="let element">
                                {{ element[child.name] }}
                            </td>
                        </ng-container>
                    </ng-container>
                </ng-container>


                <!-- Columns without children -->
                <ng-container *ngIf="!item.colspan">
                    <ng-container matColumnDef="{{ item.name }}">
                        <th mat-header-cell *matHeaderCellDef mat-sort-header
                            sortActionDescription="Sort by {{ item.name }}" rowspan="2">
                            {{ item.displayname }}
                        </th>
                        <td mat-cell *matCellDef="let element">
                            {{ element[item.name] }}
                        </td>
                    </ng-container>
                </ng-container>


            </ng-container>

            <!-- First header row
            <tr mat-header-row *matHeaderRowDef="parentColumns"></tr> -->

            <!-- Second header row for children -->

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>


            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
    </div>

    <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons aria-label="Select page of periodic elements">
    </mat-paginator>
</section>
