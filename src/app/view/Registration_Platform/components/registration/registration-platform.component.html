<section class="content-register">
  <mat-card class="register-card" appearance="outlined">
    @if (!isPublic) {
    <mat-card-header class="register-card-header" [ngClass]="{'stepper-content': open}">
      @if(!open){
      <div class="card-header-button">
        @if (isbuttonCompeticion
        ) { <button mat-flat-button class="terminar-button">Terminar</button>}@else {
        <button mat-flat-button [disabled]="isbutton" (click)="isbuttonCompeticion = true"
          (click)="terminarRegistro()">Terminar registro</button>
        <button mat-flat-button class="registrar-button" (click)="openRegister()">Registrar deportistas</button>
        }
      </div>
      }

      @if(open){
      <div class="card-header-stepper">
        <div class="card-header-button-close">
          <button mat-icon-button class="button-close" aria-label="Example icon button with a vertical three dot icon"
            (click)="openRegister()">
            <mat-icon>close</mat-icon>
          </button>
        </div>
        <app-stepper [stepValue]="dataSteper" (stepsExportValue)="registerDeportista($event)"></app-stepper>
      </div>
      }

    </mat-card-header>
    }


    <mat-card-content class="register-card-content">
      @if (!istableColspan) {
      <app-table-dinamic [dataSource]="dataSource" [column]="columnTable"></app-table-dinamic>
      }@else {
      <app-table-dinamic-colspan [column]="columnTableColspan" [dataSource]="dataSourceColspan"
        [EmiteNetx]="isPublic" (nextAthelete)="nextAthlete($event)"></app-table-dinamic-colspan>
      }

    </mat-card-content>
  </mat-card>


</section>
